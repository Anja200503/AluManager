name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Telecharger le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Installer Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Telecharger le modele de reconnaissance faciale (best-effort)
        run: |
          mkdir -p app/src/main/assets
          URLS="
          https://media.githubusercontent.com/media/michaellay19/SKRIPSI/main/assets/facenet.tflite
          https://media.githubusercontent.com/media/AlvynStane/Skripsi_Full/main/Flutter/assets/facenet.tflite
          https://media.githubusercontent.com/media/VRLzull/Absensi-flutter/main/assets/models/facenet.tflite
          https://media.githubusercontent.com/media/shubham0204/FaceRecognition_With_FaceNet_Android/master/app/src/main/assets/facenet.tflite
          "
          OK=0
          for u in $URLS; do
            echo "Essai: $u"
            curl -sL "$u" -o app/src/main/assets/facenet.tflite --max-time 180 || true
            SZ=$(stat -c%s app/src/main/assets/facenet.tflite 2>/dev/null || echo 0)
            SIG=$(dd if=app/src/main/assets/facenet.tflite bs=1 skip=4 count=4 2>/dev/null || true)
            echo "  taille=$SZ sig=[$SIG]"
            if [ "$SIG" = "TFL3" ]; then echo "  -> MODELE OK"; OK=1; break; fi
          done
          if [ "$OK" != "1" ]; then
            echo "::warning::Aucun modele facial recupere - reco faciale desactivee dans cet APK"
            rm -f app/src/main/assets/facenet.tflite
          fi

      - name: Construire l'APK
        run: gradle assembleDebug

      - name: Uploader l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AluManager-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier la Release "latest" (lien permanent)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ALU MANAGER (derniere version)
          body: "Derniere version automatique. Telechargez app-debug.apk et installez (autorisez les sources inconnues)."
          files: app/build/outputs/apk/debug/app-debug.apk
