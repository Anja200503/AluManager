name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Telecharger le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Installer Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Construire l'APK
        run: gradle assembleDebug

      - name: Uploader l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AluManager-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier la Release "latest" (lien permanent)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ALU MANAGER (derniere version)
          body: "Derniere version automatique. Telechargez app-debug.apk et installez (autorisez les sources inconnues)."
          files: app/build/outputs/apk/debug/app-debug.apk
